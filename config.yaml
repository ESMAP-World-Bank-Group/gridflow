grid_params:
  countries: ["LUX"]

input_data:
  # Active root: "reference" (tracked sample data) or "global" (your own,
  # untracked). Files below are named identically under either one.
  root: "reference"
  roots:
    reference: "data/sample"
    global: "data/global"

  # Every file gridflow reads, relative to the active root -- documents all
  # data dependencies; add new datasets here, not as a hardcoded filename.
  files:
    borders: "borders/WB_GAD_ADM0_complete.shp"
    grid: "grid.gpkg"
    population: "population_2020.tif"
    gdp: "GDP2005_1km.tif"
    pv: "pv.tif"
    wind: "wind.tif"
    admin: "admin_boundaries.gpkg"
    country: "country_names.csv"
    neighbors: "country_neighbors.json"

  backgrounds:
    countries: "data/maps/ne_110m_admin_0_countries/ne_110m_admin_0_countries.shp"
    populated_places: "data/maps/ne_110m_populated_places/ne_110m_populated_places.shp"

